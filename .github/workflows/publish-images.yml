name: Publish Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example, latest or 1.2.0)
        required: true
        default: latest
        type: string

  workflow_call:
    inputs:
      push_latest:
        type: boolean
        default: false
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  approval:
    name: Reuse approved source CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.ci.outputs.source_sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Require successful CI for the exact source
        id: ci
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireApprovedCI } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-policy.mjs`).href);
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.slice('refs/tags/'.length) : '';

            const approval = await requireApprovedCI({ github, ...context.repo, revision: context.sha, tag });
            core.setOutput('source_sha', approval.sourceSha);
            core.setOutput('ci_run_id', String(approval.runId));
            core.notice(`Reusing source CI ${approval.runId} (${approval.sourceSha}); no source checks are repeated.`);

  publish:
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Public
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: public
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mapherez/nox-wiki-public:${{ inputs.tag }}
            ${{ inputs.push_latest && 'ghcr.io/mapherez/nox-wiki-public:latest' || '' }}
            ghcr.io/mapherez/nox-wiki-public:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish Admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mapherez/nox-wiki-admin:${{ inputs.tag }}
            ${{ inputs.push_latest && 'ghcr.io/mapherez/nox-wiki-admin:latest' || '' }}
            ghcr.io/mapherez/nox-wiki-admin:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
